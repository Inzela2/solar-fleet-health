services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: solar, POSTGRES_PASSWORD: solar, POSTGRES_DB: solar}
    ports: ["5432:5432"]
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"     # local dev only: passwordless default user
    ports: ["8123:8123"]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
